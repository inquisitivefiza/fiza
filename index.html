<script>
(() => {
  const btn = document.getElementById('menuBtn'), views = [...document.querySelectorAll('.view')];
  const set = o => { document.body.classList.toggle('open', o); btn.setAttribute('aria-expanded', o); btn.setAttribute('aria-label', o ? 'Close menu' : 'Open menu'); };
  const route = () => { const id = location.hash.slice(1); const v = views.find(v => v.id === id) || views[0]; views.forEach(x => x.hidden = x !== v); v.scrollTop = 0; set(false); };
  btn.addEventListener('click', () => set(!document.body.classList.contains('open')));
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
  document.querySelectorAll('.pill').forEach(a => a.addEventListener('click', () => { if (a.getAttribute('href').replace('index.html','') === (location.hash || '#home')) set(false); }));
  addEventListener('hashchange', route); route();
})();
